<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>一表看懂校园餐</title>
<style>
  :root {
    --primary: #ff8c42;
    --primary-dark: #f06f1f;
    --success: #2ecc71;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #2b2d42;
    --muted: #9aa0b4;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
  }

  /* ===== Header ===== */
  .header {
    background:linear-gradient(135deg,#ff8c42,#ff6b35);
    color:#fff;
    padding:22px 20px 18px;
    border-radius:0 0 24px 24px;
    box-shadow:0 6px 20px rgba(255,107,53,.25);
  }
  .header .row { display:flex; align-items:center; justify-content:space-between; }
  .header h1 { font-size:21px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .header .date { font-size:13px; opacity:.92; margin-top:4px; }
  .badge { background:rgba(255,255,255,.22); padding:5px 14px; border-radius:18px; font-size:12.5px; font-weight:600; flex-shrink:0; }

  /* ===== 进度条（独立区域，不再覆盖标题） ===== */
  .progress-bar-wrap {
    margin-top:16px;
    background:rgba(255,255,255,.18);
    border-radius:12px;
    height:26px;
    position:relative;
    overflow:hidden;
  }
  .progress-bar-fill {
    height:100%;
    width:0%;
    background:#fff;
    border-radius:12px;
    transition:width .5s ease;
    position:relative;
  }
  .progress-bar-fill::after {
    content:'';
    position:absolute; top:0; right:0; bottom:0; width:20px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35));
  }
  .progress-text-row {
    display:flex; align-items:center; justify-content:space-between;
    margin-top:8px;
  }
  .progress-text-row .left { font-size:13px; font-weight:600; opacity:.95; }
  .progress-text-row .right { font-size:14px; font-weight:800; }
  .done-tag {
    display:inline-flex; align-items:center; gap:4px;
    background:#e8f9ef; color:#1fa35b; font-size:12px; font-weight:600;
    padding:4px 12px; border-radius:14px;
  }
  .half-tag {
    display:inline-flex; align-items:center; gap:4px;
    background:#fff6e6; color:#c77b10; font-size:12px; font-weight:600;
    padding:4px 12px; border-radius:14px;
  }

  .content { padding:20px 18px 110px; }
  .section-title {
    font-size:14px; color:var(--muted); font-weight:700;
    display:flex; align-items:center; gap:8px; margin:22px 0 12px;
  }
  .section-title::before { content:''; width:4px; height:16px; background:var(--primary); border-radius:3px; }

  .item {
    background:var(--card); border-radius:18px; padding:15px 16px;
    margin-bottom:12px; display:flex; align-items:flex-start; gap:13px;
    box-shadow:0 2px 10px rgba(43,45,66,.05); cursor:pointer;
    transition:transform .15s, opacity .25s, background .25s;
    user-select:none;
  }
  .item:active { transform:scale(.97); }
  .item.done { background:#f8fafc; }
  .item .icon {
    width:46px; height:46px; border-radius:14px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:23px; background:#fff2e8; transition:all .25s;
  }
  .item.done .icon { background:#e8f9ef; }
  .item .body { flex:1; min-width:0; }
  .item .txt { font-size:14.5px; font-weight:600; line-height:1.5; transition:color .25s; }
  .item.done .txt { color:var(--muted); text-decoration:line-through; font-weight:400; }
  .item .sub { font-size:12px; color:var(--muted); margin-top:3px; line-height:1.4; }
  .check {
    width:29px; height:29px; border-radius:50%; flex-shrink:0; margin-top:2px;
    border:2.5px solid #d7dbe8; display:flex; align-items:center; justify-content:center;
    transition:all .25s;
  }
  .check svg { width:14px; height:14px; stroke:#fff; stroke-width:3.5; fill:none; stroke-linecap:round; stroke-linejoin:round; opacity:0; transform:scale(0); transition:all .2s; }
  .item.done .check { background:var(--success); border-color:var(--success); }
  .item.done .check svg { opacity:1; transform:scale(1); }

  .bottom {
    position:fixed; left:0; right:0; bottom:0;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    background:#fff; border-top:1px solid #eef1f7;
    display:flex; gap:12px; box-shadow:0 -4px 20px rgba(43,45,66,.06);
  }
  .btn { flex:1; border:none; border-radius:14px; padding:15px; font-size:15px; font-weight:700; cursor:pointer; transition:all .2s; }
  .btn:active { transform:scale(.97); }
  .btn.all { background:linear-gradient(135deg,#2ecc71,#27ae60); color:#fff; }
  .btn.reset { background:#f1f3f9; color:#8a91a8; }
  .btn.reset:disabled { opacity:.5; }

  .toast {
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(20px);
    background:rgba(43,45,66,.92); color:#fff; padding:10px 20px; border-radius:24px;
    font-size:14px; opacity:0; pointer-events:none; transition:all .3s; z-index:99;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .confetti { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:100; overflow:hidden; }
  .confetti span { position:absolute; top:-12px; border-radius:3px; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="row">
    <h1>📋 一表看懂校园餐</h1>
    <span class="badge" id="dateBadge">今天</span>
  </div>
  <div class="date" id="dateLine">每日例行检查</div>

  <!-- 进度条区域（与标题分离） -->
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="bar"></div>
  </div>
  <div class="progress-text-row">
    <span class="left" id="progressLeft">已完成 0 / 0 项</span>
    <span class="right" id="pct">0%</span>
  </div>
  <div id="tagWrap" style="margin-top:6px;"></div>
</div>

<div class="content">
  <div class="section-title">校园餐食堂专项检查</div>
  <div id="list"></div>
</div>

<div class="bottom">
  <button class="btn all" onclick="toggleAll()">✅ 全部完成</button>
  <button class="btn reset" id="btnReset" onclick="resetAll()">↺ 重置</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 检查项（依据《厨房检查表》PDF 内容整理） =====
const GROUPS = [
  {
    name: "校园餐食堂专项检查",
    items: [
      { id:'k28', icon:'👥', text:'成立膳食经费、加工、遴选等监督机制，组织入校开展监督工作', sub:'建立监督机制' },
      { id:'k29', icon:'📢', text:'食堂信息对外公示（遴选公告、食品经营许可证、从业人员健康证、带量菜谱、联系电话等），及时处理问题、接受家长监督投诉；"十必须"张贴于办公区、"十不准"张贴于工作场所', sub:'信息公开 · 制度上墙' },
      { id:'k30', icon:'🤝', text:'建立"双人或多人联检"查验制度，查验人员至少包含食品安全员和食堂管理人员，集体监督、详细记录（含照片/录像）、公开透明，凭证保存合规', sub:'联检查验制度' },
      { id:'k31', icon:'🧊', text:'规范原料贮存：无食品与非食品混放；分类、分架、离墙10cm、离地10cm、有标识；冷冻(藏)设施正常运转并配备温度显示装置', sub:'原料贮存规范' },
      { id:'k32', icon:'🔪', text:'明显标识、区分加工设施，防止食品交叉污染（水池、容器、工具区分标识、分开放置和使用）', sub:'交叉污染防控' },
      { id:'k33', icon:'🧪', text:'严格管理食品添加剂：不采购、贮存、使用亚硝酸盐、染色剂等国家禁止品种', sub:'添加剂管理' },
      { id:'k34', icon:'🛡️', text:'定期开展病媒生物防制：冷冻(藏)、保温、陈列、采光、通风、洗手、消毒、三防等设施正常；无病媒迹象；有防制记录；餐厨废弃物存放清理合规', sub:'病媒生物防制' },
      { id:'k35', icon:'🍚', text:'严格规范执行行政陪餐制度，并邀请家长代表入校陪餐', sub:'行政陪餐' },
      { id:'k36', icon:'🥢', text:'餐饮具、烹饪器具清洗消毒达标，无交叉污染风险', sub:'餐具消毒' },
      { id:'k37', icon:'💰', text:'不挪用、不挤占学生伙食费，不违规使用营养膳食补助资金（不虚报就餐人数）', sub:'经费管理' },
    ]
  }
];

const STORE_KEY = 'campus_meal_checklist_v1';
let done = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || '[]'));
let allItems = GROUPS.flatMap(g=>g.items);

function todayStr(){
  const d = new Date();
  const week = ['日','一','二','三','四','五','六'][d.getDay()];
  return `${d.getMonth()+1}月${d.getDate()}日 周${week}`;
}
document.getElementById('dateBadge').textContent = todayStr();
document.getElementById('dateLine').textContent = '📍 每日例行检查 · ' + todayStr();

function render(){
  const list = document.getElementById('list');
  const total = allItems.length;
  const doneN = done.size;
  const pct = total===0 ? 0 : Math.round(doneN/total*100);

  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('progressLeft').textContent = `已完成 ${doneN} / ${total} 项`;

  const tagWrap = document.getElementById('tagWrap');
  if(doneN === total){
    tagWrap.innerHTML = '<span class="done-tag">🎉 全部完成！</span>';
  } else if(doneN > 0){
    tagWrap.innerHTML = '<span class="half-tag">⏳ 进行中</span>';
  } else {
    tagWrap.innerHTML = '';
  }

  list.innerHTML = GROUPS.map(group=>{
    const itemsHtml = group.items.map(item=>{
      const isDone = done.has(item.id);
      return `
        <div class="item ${isDone?'done':''}" onclick="toggle('${item.id}')">
          <div class="icon">${item.icon}</div>
          <div class="body">
            <div class="txt">${item.text}</div>
            <div class="sub">${item.sub}</div>
          </div>
          <div class="check"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></div>
        </div>`;
    }).join('');
    return `<div class="section-title">${group.name}</div>${itemsHtml}`;
  }).join('');

  document.getElementById('btnReset').disabled = (doneN===0);
}

function save(){ localStorage.setItem(STORE_KEY, JSON.stringify([...done])); }
function toggle(id){
  if(done.has(id)) done.delete(id); else done.add(id);
  save(); render();
  if(done.size===allItems.length) celebrate();
}
function toggleAll(){
  const all = done.size===allItems.length;
  done.clear();
  if(!all) allItems.forEach(i=>done.add(i.id));
  save(); render();
  if(!all) celebrate();
}
function resetAll(){
  done.clear(); save(); render(); showToast('已重置，重新开始检查');
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function celebrate(){
  showToast('🎉 太棒了，全部检查完成！');
  const box = document.createElement('div');
  box.className = 'confetti';
  const colors = ['#ff8c42','#2ecc71','#4a90e2','#ffd93d','#ff6b6b'];
  for(let i=0;i<60;i++){
    const s = document.createElement('span');
    const size = 6+Math.random()*8;
    s.style.cssText = `left:${Math.random()*100}%;width:${size}px;height:${size}px;background:${colors[i%colors.length]};animation-duration:${1.2+Math.random()*1.5}s;animation-delay:${Math.random()*0.4}s;`;
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 3200);
}
render();
</script>
</body>
</html>
